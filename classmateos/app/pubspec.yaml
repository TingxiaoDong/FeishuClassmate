name: classmateos_app
description: ClassmateOS 四端 App（PLAN §2.1 Flutter 单代码库），API 层对齐 classmateos/openapi.yaml。
version: 0.1.0
publish_to: none

environment:
  sdk: ^3.8.0

dependencies:
  cross_file: ^0.3.5+5
  desktop_drop: ^0.8.0
  desktop_multi_window: ^0.3.1
  file_picker: ^13.1.0
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_secure_storage: ^11.2.0
  http: ^1.6.0
  mobile_scanner: ^7.4.2
  pasteboard: ^0.5.0
  qr_flutter: ^4.1.0
  shared_preferences: ^2.5.6
  url_launcher: ^6.3.3
  web: ^1.1.1
  web_socket_channel: ^3.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
