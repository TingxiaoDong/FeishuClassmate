# ClassmateOS OpenAPI 草案（PLAN §3-P0 交付物④）
#
# 覆盖平台后端 MVP（P1）所需的最小面：
#   - 账号/组织（替代飞书 OAuth+通讯录，user_id 对齐 open_id）
#   - IM（单聊/群聊/bot 消息/卡片交互/ask_user_question 等价物）
#   - 表格引擎（替代 Bitable：表/字段/记录 CRUD，DDL 由 schema-to-sql.mjs 生成）
#   - 文件（MinIO S3 预签名上传/下载）
#   - Bot 网关（平台事件 WS push → 大脑 runtime；大脑 → 平台消息 REST）
#
# 文档/云盘/日历/任务为 P1+，此草案不覆盖。

openapi: 3.0.3
info:
  title: ClassmateOS API
  version: 0.1.0-draft
  description: 飞书同学自研四端协作平台后端（替代飞书 OpenAPI 的最小面）。
servers:
  - url: http://localhost:8080/api/v1
tags:
  - name: auth
  - name: users
  - name: im
  - name: tables
  - name: files
  - name: bot
  - name: calendar
  - name: tasks
  - name: docs
  - name: dashboard
  - name: notifications
  - name: search
    description: 二期迭代 4 全局搜索与最近访问

paths:
  # ---------------------------------------------------------------------------
  # 账号 / 组织
  # ---------------------------------------------------------------------------
  /auth/login:
    post:
      tags: [ auth ]
      summary: 账号密码登录，返回访问令牌
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ username, password ]
              properties:
                username: { type: string }
                password: { type: string, format: password }
      responses:
        '200':
          description: 登录成功
          content:
            application/json:
              schema:
                type: object
                required: [ access_token, refresh_token, user ]
                properties:
                  access_token: { type: string, description: JWT，默认 2h }
                  refresh_token: { type: string }
                  user: { $ref: '#/components/schemas/User' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /auth/refresh:
    post:
      tags: [ auth ]
      summary: 刷新访问令牌
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ refresh_token ]
              properties:
                refresh_token: { type: string }
      responses:
        '200':
          description: 新令牌对
          content:
            application/json:
              schema:
                type: object
                properties:
                  access_token: { type: string }
                  refresh_token: { type: string }

  /users/me/password:
    post:
      tags: [ users ]
      summary: 修改本人密码（其他设备下线，当前设备保留）
      responses:
        '204': { description: 成功 }
        '400': { description: INVALID_PASSWORD / WEAK_PASSWORD }
  /users/me/sessions:
    get:
      tags: [ users ]
      summary: 本人登录设备列表
      responses:
        '200': { description: "{items:[{session_id,device_name,platform,ip,last_active_at,created_at,current}]}" }
  /users/me/sessions/{session_id}:
    delete:
      tags: [ users ]
      summary: 退出某个登录设备
      parameters: [ { name: session_id, in: path, required: true, schema: { type: string } } ]
      responses:
        '204': { description: 成功 }
        '404': { description: 不存在或不是本人的 }
  /users/me/logout-all:
    post:
      tags: [ users ]
      summary: 退出除当前设备外的所有设备
      responses:
        '200': { description: "{revoked}" }
  /users/{user_id}/avatar:
    get:
      tags: [ users ]
      summary: 用户头像（公开，无需令牌）
      parameters: [ { name: user_id, in: path, required: true, schema: { type: string } } ]
      responses:
        '200': { description: 图片 }
        '404': { description: 没有头像 }
  /users/{user_id}/reset-password:
    post:
      tags: [ admin ]
      summary: 管理员重置成员密码（返回一次性密码，成员下次登录须改密）
      parameters: [ { name: user_id, in: path, required: true, schema: { type: string } } ]
      responses:
        '200': { description: "{password}" }
  /users/{user_id}/logout-all:
    post:
      tags: [ admin ]
      summary: 管理员强制成员所有设备下线
      parameters: [ { name: user_id, in: path, required: true, schema: { type: string } } ]
      responses:
        '200': { description: "{revoked}" }
  /admin/security-settings:
    get:
      tags: [ admin ]
      summary: 读取安全设置
      responses:
        '200': { description: 安全设置 }
    put:
      tags: [ admin ]
      summary: 修改安全设置（可部分更新）
      responses:
        '200': { description: 修改后的安全设置 }
        '422': { description: 校验失败 }
  /users/me:
    get:
      tags: [ users ]
      summary: 当前用户信息
      responses:
        '200':
          description: 当前用户
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }

  /users:
    get:
      tags: [ users ]
      summary: 组织成员列表（通讯录）
      parameters:
        - { name: keyword, in: query, schema: { type: string } }
        - { name: page, in: query, schema: { type: integer, default: 1 } }
        - { name: page_size, in: query, schema: { type: integer, default: 50 } }
      responses:
        '200':
          description: 成员分页
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/User' } }
                  has_more: { type: boolean }
                  total: { type: integer }

  # ---------------------------------------------------------------------------
  # IM
  # ---------------------------------------------------------------------------
  /chats:
    get:
      tags: [ im ]
      summary: 我的会话列表（单聊+群聊）
      responses:
        '200':
          description: 会话分页
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/Chat' } }
                  has_more: { type: boolean }
    post:
      tags: [ im ]
      summary: 创建会话（单聊或群聊）
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ member_ids ]
              properties:
                name: { type: string, description: 群名；单聊可空 }
                member_ids: { type: array, items: { type: string } }
      responses:
        '201':
          description: 已创建
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Chat' }

  /chats/{chat_id}/messages:
    get:
      tags: [ im ]
      summary: 拉取消息历史（倒序分页）
      parameters:
        - { $ref: '#/components/parameters/chatId' }
        - { name: before_message_id, in: query, schema: { type: string } }
        - { name: page_size, in: query, schema: { type: integer, default: 30 } }
      responses:
        '200':
          description: 消息分页
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/Message' } }
                  has_more: { type: boolean }
    post:
      tags: [ im ]
      summary: 发送消息（文本/富文本/卡片）
      parameters:
        - { $ref: '#/components/parameters/chatId' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ msg_type, content ]
              properties:
                msg_type:
                  type: string
                  enum: [ text, post, image, file, interactive_card ]
                content:
                  type: object
                  description: 按 msg_type 而定；interactive_card 时为卡片 JSON。post 支持 markdown（≤2 万字）；text 支持 mentions [{user_id,name}]；前端传的 link_previews 会被忽略，由后端异步生成
                thread_root_id:
                  type: string
                  description: 迭代4：话题回复，填话题第一条消息 ID；不能在话题回复里再开话题（422）
                also_send_to_chat:
                  type: boolean
                  description: 迭代4：话题回复同时出现在会话消息流
      responses:
        '201':
          description: 已发送
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Message' }

  /chats/{chat_id}/messages/{message_id}/read:
    post:
      tags: [ im ]
      summary: 已读回执（标记本人已读至该消息）
      parameters:
        - { $ref: '#/components/parameters/chatId' }
        - { name: message_id, in: path, required: true, schema: { type: string } }
      responses:
        '204': { description: 已记录 }

  /cards/{card_id}/actions:
    post:
      tags: [ im ]
      summary: 卡片交互回调（ask_user_question 等价物）
      description: >-
        大脑发出的交互卡片上按钮/表单被点击后，客户端调用此接口； 平台把回答通过 Bot 事件 WS 推送给大脑 runtime，恢复被挂起的会话。
      parameters:
        - { name: card_id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ action ]
              properties:
                action: { type: string, description: 按钮 value / 表单 action id }
                form_values: { type: object, additionalProperties: true }
      responses:
        '202': { description: 已受理，将异步推送给 bot }

  # ---------------------------------------------------------------------------
  # 表格引擎（替代 Bitable；底层表结构见 classmateos/schema.sql）
  # ---------------------------------------------------------------------------
  /tables:
    get:
      tags: [ tables ]
      summary: 表清单（内置表在前，自定义表按创建时间正序；每项带 builtin）
      responses:
        '200':
          description: 表定义列表
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/TableMeta' }
    post:
      tags: [ tables ]
      summary: 新建数据表（所有已登录、未禁用用户）
      description: |
        规则见《多维表格新建数据表接口需求》。key 由后端生成（tbl_xxxxxxxxxx），创建后即可用于 /tables/{table_key}/records。
        同一用户 24 小时内重复提交同一 client_request_id 返回第一次创建的表（200）。
        字段类型支持 1/2/3/4/5/7/11/15/17；单选、多选必须带 options（1–50 项），可选 option_colors（不给则自动分配）。
        field_name 不能用系统保留名：record_id、created_at、updated_at、created_by、updated_by、feishu_record_id、cos_created_by、cos_updated_by。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ name, primary_field, fields ]
              properties:
                name: { type: string, maxLength: 60 }
                description: { type: string, maxLength: 500, nullable: true }
                primary_field: { type: string, description: fields 中的文本（type 1）且必填字段 }
                client_request_id: { type: string, maxLength: 128 }
                fields:
                  type: array
                  minItems: 1
                  maxItems: 30
                  items:
                    type: object
                    required: [ field_name, title, type ]
                    properties:
                      field_name: { type: string, pattern: '^[a-z][a-z0-9_]{0,62}$' }
                      title: { type: string, maxLength: 40 }
                      type: { type: integer, enum: [ 1, 2, 3, 4, 5, 7, 11, 15, 17 ] }
                      required: { type: boolean, default: false }
                      options: { type: array, items: { type: string, maxLength: 40 }, maxItems: 50 }
                      option_colors: { type: object, additionalProperties: { type: string } }
      responses:
        '201':
          {
            description: 已创建，返回与 GET /tables 单项相同的结构,
            content: { application/json: { schema: { $ref: '#/components/schemas/TableMeta' } } }
          }
        '200':
          {
            description: client_request_id 幂等命中，返回第一次创建的表,
            content: { application/json: { schema: { $ref: '#/components/schemas/TableMeta' } } }
          }
        '401': { description: 未登录（UNAUTHORIZED） }
        '409': { description: 表名重复（TABLE_NAME_EXISTS），去空格后大小写不敏感，内置表名也算 }
        '422': { description: '参数不正确（VALIDATION_FAILED），errors[].field 形如 fields[1].options' }

  /tables/{table_key}/records:
    get:
      tags: [ tables ]
      summary: 查询记录（过滤/排序/分页）
      parameters:
        - { $ref: '#/components/parameters/tableKey' }
        - name: filter
          in: query
          schema: { type: string }
          description: 简化过滤表达式，如 status="进行中" AND progress<50
        - {
            name: sort,
            in: query,
            schema: { type: string },
            description: 如 due_date asc
          }
        - { name: page_token, in: query, schema: { type: string } }
        - {
            name: page_size,
            in: query,
            schema: { type: integer, default: 100, maximum: 500 }
          }
      responses:
        '200':
          description: 记录分页
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/Record' } }
                  has_more: { type: boolean }
                  page_token: { type: string }
    post:
      tags: [ tables ]
      summary: 新建记录
      parameters:
        - { $ref: '#/components/parameters/tableKey' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ fields ]
              properties:
                fields: { $ref: '#/components/schemas/RecordFields' }
      responses:
        '201':
          description: 已创建
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Record' }
        '422': { description: 字段校验失败（类型/单选值越界） }

  /tables/{table_key}/records/{record_id}:
    get:
      tags: [ tables ]
      summary: 读取单条记录
      parameters:
        - { $ref: '#/components/parameters/tableKey' }
        - { $ref: '#/components/parameters/recordId' }
      responses:
        '200':
          description: 记录
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Record' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [ tables ]
      summary: 更新记录（部分字段）
      parameters:
        - { $ref: '#/components/parameters/tableKey' }
        - { $ref: '#/components/parameters/recordId' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ fields ]
              properties:
                fields: { $ref: '#/components/schemas/RecordFields' }
      responses:
        '200':
          description: 已更新
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Record' }
    delete:
      tags: [ tables ]
      summary: 删除记录
      parameters:
        - { $ref: '#/components/parameters/tableKey' }
        - { $ref: '#/components/parameters/recordId' }
      responses:
        '204': { description: 已删除 }

  # ---------------------------------------------------------------------------
  # 文件（MinIO 预签名）
  # ---------------------------------------------------------------------------
  /files/upload-url:
    post:
      tags: [ files ]
      summary: 申请上传预签名 URL
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ file_name, size ]
              properties:
                file_name: { type: string }
                size: { type: integer, format: int64 }
                content_type: { type: string }
      responses:
        '200':
          description: 预签名 URL 与 file_key
          content:
            application/json:
              schema:
                type: object
                properties:
                  file_key: { type: string }
                  upload_url: { type: string }
                  expires_in: { type: integer }

  /files/{file_key}/download-url:
    get:
      tags: [ files ]
      summary: 获取下载预签名 URL
      parameters:
        - { name: file_key, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: 下载 URL
          content:
            application/json:
              schema:
                type: object
                properties:
                  download_url: { type: string }
                  expires_in: { type: integer }

  # ---------------------------------------------------------------------------
  # Bot 网关（大脑 ↔ 平台）
  # ---------------------------------------------------------------------------
  /bot/messages:
    post:
      tags: [ bot ]
      summary: 大脑代 bot 发送消息/卡片
      security:
        - botToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ receive_id, msg_type, content ]
              properties:
                receive_id: { type: string, description: chat_id 或 user_id }
                receive_id_type: { type: string, enum: [ chat_id, user_id ], default: chat_id }
                msg_type: { type: string, enum: [ text, post, interactive_card ] }
                content: { type: object }
                reply_to: { type: string, description: 被回复的 message_id }
      responses:
        '201':
          description: 已发送
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Message' }

  /bot/events/ws:
    get:
      tags: [ bot ]
      summary: Bot 事件长连接（WebSocket upgrade）
      description: >-
        大脑 runtime 连接此端点接收平台事件：message.receive（用户消息）、
        card.action（ask_user_question 回答）、message.read 等。 事件帧格式见
        components.schemas.BotEvent。支持 ?since=<event_id> 断点续传。
      security:
        - botToken: []
      responses:
        '101': { description: Switching Protocols }

  /events/ws:
    get:
      tags: [ im ]
      summary: 用户态事件长连接（四端实时收消息）
      description: >-
        客户端（Flutter 四端）连接此端点接收本人所在会话的新消息事件 （message.receive，含 bot
        回复）。浏览器/移动端不便设自定义头， JWT 走 ?token=<access_token>；非本会话成员收不到消息。
      security: []
      parameters:
        - { name: token, in: query, required: true, schema: { type: string } }
      responses:
        '101': { description: Switching Protocols }

  # ---------------------------------------------------------------------------
  # 日历 / 任务（P1：会议排期、帮扶提醒）
  # ---------------------------------------------------------------------------
  /calendar/events:
    get:
      tags: [ calendar ]
      summary: 查询时间窗内的日程
      parameters:
        - name: from
          in: query
          required: false
          schema:
            type: integer
            format: int64
          description: from/to 或 start_ms/end_ms 必须提供完整的一对
        - name: to
          in: query
          required: false
          schema:
            type: integer
            format: int64
          description: from/to 或 start_ms/end_ms 必须提供完整的一对
        - name: start_ms
          in: query
          required: false
          schema:
            type: integer
            format: int64
          description: from/to 或 start_ms/end_ms 必须提供完整的一对
        - name: end_ms
          in: query
          required: false
          schema:
            type: integer
            format: int64
          description: from/to 或 start_ms/end_ms 必须提供完整的一对
      responses:
        '200':
          description: 日程列表
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/CalendarEvent' } }
    post:
      tags: [ calendar ]
      summary: 创建日程
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ title, start_ms, end_ms ]
              properties:
                title: { type: string }
                start_ms: { type: integer, format: int64 }
                end_ms: { type: integer, format: int64 }
                attendee_ids: { type: array, items: { type: string } }
                description: { type: string }
                recurrence:
                  type: string
                  nullable: true
                  description: 试验接口：仅支持常用 RRULE 子集，calendar.recurrence 开关保持 false
      responses:
        '201':
          description: 已创建
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CalendarEvent' }
        '422': { description: 时间窗非法（end<=start） }

  /calendar/events/{event_id}:
    delete:
      tags:
        - calendar
      summary: 删除日程或指定重复范围
      parameters:
        - name: event_id
          in: path
          required: true
          schema:
            type: string
        - name: scope
          in: query
          schema:
            type: string
            enum:
              - this
              - following
              - all
      responses:
        "204":
          description: 成功
        "403":
          description: 无权操作
        "404":
          description: 资源不存在
        "409":
          description: 状态或版本冲突
        "422":
          description: 参数错误
    get:
      tags:
        - calendar
      summary: 读取日程或重复实例
      parameters:
        - name: event_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: 成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CalendarEvent"
        "403":
          description: 无权操作
        "404":
          description: 资源不存在
        "409":
          description: 状态或版本冲突
        "422":
          description: 参数错误
    patch:
      tags:
        - calendar
      summary: 试验：修改日程及指定重复范围
      parameters:
        - name: event_id
          in: path
          required: true
          schema: &anc1
            type: string
        - name: scope
          in: query
          schema:
            type: string
            enum:
              - this
              - following
              - all
      responses:
        "200":
          description: 成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CalendarEvent"
        "403":
          description: 无权操作
        "404":
          description: 资源不存在
        "409":
          description: 状态或版本冲突
        "422":
          description: 参数错误
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title: *anc1
                start_ms:
                  type: integer
                  format: int64
                end_ms:
                  type: integer
                  format: int64
                recurrence:
                  type: string
