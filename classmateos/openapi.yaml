      summary: 有序分组
      parameters:
        - name: list_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: 成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      additionalProperties: true
                  has_more:
                    type: boolean
                  page_token:
                    type: string
                    nullable: true
                  total:
                    type: integer
        "403":
          description: 无权操作
        "404":
          description: 资源不存在
        "409":
          description: 状态或版本冲突
        "422":
          description: 参数错误
    post:
      tags:
        - tasks
      summary: 创建分组
      parameters:
        - name: list_id
          in: path
          required: true
          schema: &anc7
            type: string
      responses:
        "201":
          description: 成功
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "403":
          description: 无权操作
        "404":
          description: 资源不存在
        "409":
          description: 状态或版本冲突
        "422":
          description: 参数错误
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: *anc7
  /tasklists/{list_id}/sections/{section_id}:
    patch:
      tags:
        - tasks
      summary: 分组改名
      parameters:
        - name: list_id
          in: path
          required: true
          schema:
            type: string
        - name: section_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: 成功
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "403":
          description: 无权操作
        "404":
          description: 资源不存在
        "409":
          description: 状态或版本冲突
        "422":
          description: 参数错误
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
    delete:
      tags:
        - tasks
      summary: 删除分组，任务移至未分组
      parameters:
        - name: list_id
          in: path
          required: true
          schema: &anc8
            type: string
        - name: section_id
          in: path
          required: true
          schema: *anc8
      responses:
        "204":
          description: 成功
        "403":
          description: 无权操作
        "404":
          description: 资源不存在
        "409":
          description: 状态或版本冲突
        "422":
          description: 参数错误
  /tasklists/{list_id}/tasks:
    get:
      tags:
        - tasks
      summary: 清单任务
      parameters:
        - name: list_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: 成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      additionalProperties: true
                  has_more:
                    type: boolean
                  page_token:
                    type: string
                    nullable: true
                  total:
                    type: integer
        "403":
          description: 无权操作
        "404":
          description: 资源不存在
        "409":
          description: 状态或版本冲突
        "422":
          description: 参数错误
  /tasks/{task_id}/tasklists:
    post:
      tags:
        - tasks
      summary: 加入清单或移动分组
      parameters:
        - name: task_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: 成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskItem"
        "403":
          description: 无权操作
        "404":
          description: 资源不存在
        "409":
          description: 状态或版本冲突
        "422":
          description: 参数错误
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                list_id:
                  type: string
                section_id:
                  type: string
                  nullable: true
  /tasks/{task_id}/tasklists/{list_id}:
    delete:
      tags:
        - tasks
      summary: 解除清单关联
      parameters:
        - name: task_id
          in: path
          required: true
          schema:
            type: string
        - name: list_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: 成功
        "403":
          description: 无权操作
        "404":
          description: 资源不存在
        "409":
          description: 状态或版本冲突
        "422":
          description: 参数错误

  # ---------------- 二期迭代 4：消息增强 ----------------
  /chats/{chat_id}:
    patch:
      tags: [ im ]
      summary: 修改会话（迭代4：thread_mode 切换话题模式）
      parameters:
        - { $ref: '#/components/parameters/chatId' }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                thread_mode: { type: boolean }
      responses:
        '200': { description: 会话对象（含 thread_mode、thread_unread_count、pinned_message_ids） }
  /messages/{message_id}/read-users:
    get:
      tags: [ im ]
      summary: 已读 / 未读名单（只有发送人可看，其他人 403）
      parameters:
        - { name: message_id, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: 名单
          content:
            application/json:
              schema:
                type: object
                properties:
                  read: { type: array, items: { type: string } }
                  unread: { type: array, items: { type: string } }
        '403': { description: 不是发送人 }
  /messages/{message_id}/thread:
    get:
      tags: [ im ]
      summary: 话题回复（正序分页，打开即记为已读）
      parameters:
        - { name: message_id, in: path, required: true, schema: { type: string } }
        - { name: page_size, in: query, schema: { type: integer, default: 50, maximum: 200 } }
        - { name: page_token, in: query, schema: { type: string } }
      responses:
        '200':
          description: 回复分页
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/Message' } }
                  has_more: { type: boolean }
                  page_token: { type: string }
        '422': { description: 传的是话题回复而不是根消息 }
  /messages/{message_id}/thread/follow:
    post:
      tags: [ im ]
      summary: 关注话题
      parameters:
        - { name: message_id, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: 更新后的根消息 }
    delete:
      tags: [ im ]
      summary: 取消关注话题
      parameters:
        - { name: message_id, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: 更新后的根消息 }
  /messages/{message_id}/reactions:
    post:
      tags: [ im ]
      summary: 添加表情回应（幂等；每条最多 50 种，每人每分钟 60 次）
      parameters:
        - { name: message_id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ emoji ]
              properties:
                emoji: { type: string, pattern: '^[A-Za-z0-9_]{1,32}$' }
      responses:
        '200': { description: 更新后的消息，并推 message.updated }
        '429': { description: RATE_LIMITED }
  /messages/{message_id}/reactions/{emoji}:
    delete:
      tags: [ im ]
      summary: 取消表情回应
      parameters:
        - { name: message_id, in: path, required: true, schema: { type: string } }
        - { name: emoji, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: 更新后的消息 }
  /messages/forward:
    post:
      tags: [ im ]
      summary: 逐条 / 合并转发（最多 100 条消息、10 个会话）
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ message_ids, chat_ids ]
              properties:
                message_ids: { type: array, items: { type: string }, maxItems: 100 }
                chat_ids: { type: array, items: { type: string }, maxItems: 10 }
                mode: { type: string, enum: [ single, merge ], default: single }
                note: { type: string, maxLength: 5000 }
                client_request_id: { type: string, maxLength: 128 }
      responses:
        '201':
          description: 新生成的消息
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/Message' } }
        '200': { description: 相同 client_request_id 重复提交，返回第一次的结果 }
        '409': { description: REQUEST_IN_PROGRESS }
        '422': { description: 源消息 / 目标会话不可用，field 指出第几项 }
  /messages/urgent/pending:
    get:
      tags: [ im ]
      summary: 我还没确认的加急
      responses:
        '200':
          description: 列表
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      properties:
                        message_id: { type: string }
                        chat_id: { type: string }
                        from_user_id: { type: string }
                        preview: { type: string }
                        urged_at: { type: string, format: date-time }
  /messages/{message_id}/urgent:
    post:
      tags: [ im ]
      summary: 加急自己发的消息
      parameters:
        - { name: message_id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ user_ids ]
              properties:
                user_ids: { type: array, items: { type: string } }
                type: { type: string, enum: [ app, push ], default: app }
      responses:
        '200': { description: 更新后的消息；被加急的人收到 message.urgent }
        '429': { description: URGENT_TOO_FREQUENT }
  /messages/{message_id}/urgent/ack:
    post:
      tags: [ im ]
      summary: 确认加急（推 message.urgent_acked）
      parameters:
        - { name: message_id, in: path, required: true, schema: { type: string } }
      responses:
        '204': { description: 已确认 }
  /messages/{message_id}/favorite:
    post:
      tags: [ im ]
      summary: 收藏（幂等）
      parameters:
        - { name: message_id, in: path, required: true, schema: { type: string } }
      responses:
        '204': { description: 已收藏 }
    delete:
      tags: [ im ]
      summary: 取消收藏
      parameters:
        - { name: message_id, in: path, required: true, schema: { type: string } }
      responses:
        '204': { description: 已取消 }
  /favorites:
    get:
      tags: [ im ]
      summary: 我的收藏
      parameters:
        - { name: page_size, in: query, schema: { type: integer } }
        - { name: page_token, in: query, schema: { type: string } }
      responses:
        '200':
          description: 收藏分页
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      properties:
                        favorite_id: { type: string }
                        message: { $ref: '#/components/schemas/Message' }
                        chat_name: { type: string }
                        created_at: { type: string, format: date-time }
                  has_more: { type: boolean }
                  page_token: { type: string }
  /chats/{chat_id}/pins:
    get:
      tags: [ im ]
      summary: 会话的 Pin 消息
      parameters:
        - { $ref: '#/components/parameters/chatId' }
      responses:
        '200': { description: '{ items: [Message] }' }
  /chats/{chat_id}/pins/{message_id}:
    post:
      tags: [ im ]
      summary: Pin 消息（每个会话最多 10 条）
      parameters:
        - { $ref: '#/components/parameters/chatId' }
        - { name: message_id, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: 已 Pin，推 chat.updated }
        '409': { description: PIN_LIMIT }
    delete:
      tags: [ im ]
      summary: 取消 Pin
      parameters:
        - { $ref: '#/components/parameters/chatId' }
        - { name: message_id, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: 已取消，推 chat.updated }

  # ---------------- 二期迭代 4：全局搜索 / 最近访问 ----------------
  /search:
    get:
      tags: [ search ]
      summary: 全局搜索（按权限过滤，total 准确，<em> 高亮）
      parameters:
        - { name: q, in: query, required: true, schema: { type: string, maxLength: 100 }, description: 空格分隔多个词（最多 5 个），都要出现 }
        - { name: types, in: query, schema: { type: string }, description: '逗号分隔：user,chat,message,doc,wiki,record,task,event；默认除 wiki 外 7 类' }
        - { name: page_size, in: query, schema: { type: integer, maximum: 50 }, description: 多类型默认 3，单类型默认 20 }
        - { name: page_token, in: query, schema: { type: string }, description: 仅单类型时生效 }
        - { name: chat_id, in: query, schema: { type: string } }
        - { name: sender_id, in: query, schema: { type: string } }
        - { name: owner_id, in: query, schema: { type: string } }
        - { name: start_ms, in: query, schema: { type: integer, format: int64 } }
        - { name: table_key, in: query, schema: { type: string } }
      responses:
        '200':
          description: 分组结果
          content:
            application/json:
              schema:
                type: object
                properties:
                  groups: { type: array, items: { $ref: '#/components/schemas/SearchGroup' } }
        '400': { description: 空关键词 }
        '422': { description: 关键词过长、未知类型或坏游标 }
  /recent:
    get:
      tags: [ search ]
      summary: 最近访问（打开文档、表格、单条记录时自动记录）
      parameters:
        - { name: page_size, in: query, schema: { type: integer, default: 10, maximum: 50 } }
      responses:
        '200':
          description: 最新在前，已无权限的不返回
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      properties:
                        type: { type: string, enum: [ doc, table, record ] }
                        id: { type: string }
                        title: { type: string }
                        visited_at: { type: string, format: date-time }
                        extra: { type: object, additionalProperties: true }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    botToken:
      type: apiKey
      in: header
      name: X-Bot-Token

  parameters:
    chatId:
      name: chat_id
      in: path
      required: true
      schema: { type: string }
    tableKey:
      name: table_key
      in: path
      required: true
      schema:
        type: string
        description: 内部表 key（projects/gantt/equipment/...，见 schema.sql）
    recordId:
      name: record_id
      in: path
      required: true
      schema: { type: string }

  responses:
    Unauthorized:
      description: 未认证或令牌过期
    NotFound:
      description: 资源不存在

  schemas:
    User:
      type: object
      required: [ user_id, name ]
      properties:
        user_id: { type: string, description: 对齐飞书 open_id 的稳定 ID }
        name: { type: string }
        email: { type: string }
        avatar_file_key: { type: string }
        role: { type: string, enum: [ admin, member, bot ] }
        department: { type: string, nullable: true }
        title: { type: string, nullable: true }
        phone: { type: string, nullable: true }
        status_text: { type: string, nullable: true, description: 个性签名 }
        permissions:
          type: array
          items: { type: string }
          description: 权限点并集（迭代 5 第 3 节）。只在本人视角返回：登录、刷新、GET/PATCH /users/me；通讯录里没有

    Chat:
      type: object
      required: [ chat_id, chat_type ]
      properties:
        chat_id: { type: string }
        chat_type: { type: string, enum: [ p2p, group ] }
        name: { type: string }
        member_ids: { type: array, items: { type: string } }
        last_message: { $ref: '#/components/schemas/Message' }
        unread_count: { type: integer }

    Message:
      type: object
      required: [ message_id, chat_id, sender_id, msg_type, created_at ]
      properties:
        message_id: { type: string }
        chat_id: { type: string }
        sender_id: { type: string, description: user_id；bot 消息为 bot 的 user_id }
        msg_type: { type: string, enum: [ text, post, image, file, interactive_card, system ] }
        content: { type: object, additionalProperties: true }
        reply_to: { type: string }
        created_at: { type: string, format: date-time }
        read_by: { type: array, items: { type: string } }
        thread_root_id: { type: string, nullable: true, description: 迭代4：话题回复所属话题 }
        also_send_to_chat: { type: boolean }
        member_count: { type: integer, description: 迭代4：仅自己发的消息，除自己和机器人外的成员数 }
        read_count: { type: integer, description: 迭代4：仅自己发的消息，准确已读人数 }
        thread:
          type: object
          description: 迭代4：仅话题根消息
          properties:
            reply_count: { type: integer }
            last_reply_at: { type: string, format: date-time, nullable: true }
            participants: { type: array, items: { type: string } }
            followed: { type: boolean }
        reactions:
          type: array
          items:
            type: object
            properties:
              emoji: { type: string }
              count: { type: integer }
              user_ids: { type: array, items: { type: string } }
              reacted_by_me: { type: boolean }
        forwarded_from:
          type: object
          properties:
            chat_id: { type: string }
            chat_name: { type: string }
            sender_id: { type: string }
            message_id: { type: string }
        urgent:
          type: object
          description: 迭代4：仅发送人可见
          properties:
            user_ids: { type: array, items: { type: string } }
            ack_user_ids: { type: array, items: { type: string } }

    SearchGroup:
      type: object
      required: [ type, total, items ]
      properties:
        type: { type: string, enum: [ user, chat, message, doc, wiki, record, task, event ] }
        total: { type: integer, description: 按权限过滤后的准确总数 }
        page_token: { type: string, description: 仅单类型搜索时返回，不透明，原样回传 }
        items:
          type: array
          items:
            type: object
            properties:
              id: { type: string }
              title: { type: string, description: 带 <em> 高亮 }
              snippet: { type: string, description: 命中附近片段，带 <em> 高亮 }
              updated_at: { type: string }
              extra: { type: object, additionalProperties: true }

    TableMeta:
      type: object
      required: [ key, name, fields ]
      properties:
        key: { type: string }
        name: { type: string }
        fields:
          type: array
          items:
            type: object
            properties:
              field_name: { type: string }
              type: { type: integer, description: 沿用 Bitable 字段类型编号 }
              options: { type: array, items: { type: string } }

    RecordFields:
      type: object
      additionalProperties: true
      description: 字段名 → 值；类型规则与 Bitable 相同（人员=[{"id"}], 日期=ms 时间戳, 单选=字符串）

    Record:
      type: object
      required: [ record_id, fields ]
      properties:
        record_id: { type: string }
        fields: { $ref: '#/components/schemas/RecordFields' }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    BotEvent:
      type: object
      required: [ event_id, event_type, created_at ]
      properties:
        event_id: { type: string }
        event_type:
          type: string
          enum: [ message.receive, card.action, message.read, chat.member_added ]
        created_at: { type: string, format: date-time }
        message: { $ref: '#/components/schemas/Message' }
        card_action:
          type: object
          properties:
            card_id: { type: string }
            user_id: { type: string }
            action: { type: string }
            form_values: { type: object, additionalProperties: true }

    CalendarEvent:
      type: object
      required: [ event_id, title, start_ms, end_ms, created_by ]
      properties:
        event_id: { type: string }
        title: { type: string }
        start_ms: { type: integer, format: int64 }
        end_ms: { type: integer, format: int64 }
        attendee_ids: { type: array, items: { type: string } }
        description: { type: string }
        created_by: { type: string }
        recurrence:
          type: string
          nullable: true
          description: 试验接口：仅支持常用 RRULE 子集，calendar.recurrence 开关保持 false
        recurring_event_id:
          type: string
          nullable: true
        original_start_ms:
          type: integer
          format: int64
          nullable: true
        is_exception:
          type: boolean

    TaskItem:
      type: object
      required: [ task_id, title, status, created_by, created_at ]
      properties:
        task_id: { type: string }
        title: { type: string }
        status: { type: string, enum: [ pending, in_progress, done, cancelled ] }
        assignee_id: { type: string }
        due_ms: { type: integer, format: int64 }
        description: { type: string }
        created_by: { type: string }
        created_at: { type: string, format: date-time }
        parent_id:
          type: string
          nullable: true
        depth:
          type: integer
        subtask_count:
          type: integer
        subtask_done_count:
          type: integer
        follower_ids:
          type: array
          items:
            type: string
        permissions:
          type: object
          additionalProperties:
            type: boolean
        tasklists:
          type: array
          items:
            type: object
            additionalProperties: true

security:
  - bearerAuth: []
